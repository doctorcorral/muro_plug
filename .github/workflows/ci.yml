name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# doctorcorral/muro-http runs on GitHub-hosted ubuntu-latest and
# macos-latest, not on the self-hosted muro-mac runners. This repo
# follows that choice.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.1"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-29.1-elixir-1.20.4-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-29.1-elixir-1.20.4-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Test
        run: mix test
